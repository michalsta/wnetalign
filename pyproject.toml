[build-system]
# nanobind pin: wnetalign's extension shares nanobind-registered types (e.g.
# NetworkSimplexConfig, CVectorDistributionFloat*) with the wnet and pylmcf
# extensions. Type sharing works only when all three are built against the same
# nanobind internals ABI version. The published wnet/pylmcf wheels are ABI v20,
# which nanobind 2.13.x and 2.14.x produce (2.12 is v19, 2.15 is v21, 3.0 is v22).
# Building against a mismatched nanobind yields "ImportError: std::bad_cast" at
# import. Bump this range in lockstep with the wnet/pylmcf wheels.
requires = ["scikit-build-core", "nanobind>=2.13,<2.15", "pylmcf", "wnet>=1.2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "wnetalign"
version = "1.0.0"
description = "Python implementation of spectral alignment using Wasserstein metric"
dependencies = ["pylmcf", "wnet>=1.2.0", "numpy"]
authors = [{ name="Michał Startek", email="michal.startek@mimuw.edu.pl" }]
maintainers = [{ name="Michał Startek", email="michal.startek@mimuw.edu.pl" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENCE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Development Status :: 5 - Production/Stable",
]
requires-python = ">=3.9"

[project.urls]
"Homepage" = "https://github.com/michalsta/wnetalign"
"Repository" = "https://github.com/michalsta/wnetalign.git"

[project.optional-dependencies]
extras = ["pyopenms"]
pytest = ["pytest", "pandas", "numpy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.scikit-build.sdist]
exclude = ["**/*"]
include = [
    "/src/**/*.py",
    "/src/**/*.c",
    "/src/**/*.hpp",
    "/src/**/*.h",
    "/src/**/*.cpp",
    "/src/**/*.cc",
    "/LICENCE",
    "/README.md",
    "/pyproject.toml",
    "/CMakeLists.txt"
]
