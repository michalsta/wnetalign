name: Build

on:
  push:
    branches:
      - ci_wheels
    tags:
      - v*

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    if: github.repository_owner == 'michalsta'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # macos-13 is an intel runner, macos-14 is apple silicon
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-15-intel, macos-latest, windows-11-arm]

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Used to host cibuildwheel
      - uses: actions/setup-python@v5

      - name: Check version
        if: startsWith(github.ref, 'refs/tags/v')
        run: python .github/scripts/check_version.py

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        # to supply options, put them in 'env', like:
        env:
          GITHUB_BUILDING_WHEELS: 1
          VERBOSE: 1
          MACOSX_DEPLOYMENT_TARGET: "10.15"
          CIBW_ENABLE: "pypy"
          CIBW_BUILD: "cp* pp*"
          CIBW_SKIP: "cp39-win_arm64 cp310-win_arm64"

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    if: github.repository_owner == 'michalsta'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check version
        if: startsWith(github.ref, 'refs/tags/v')
        run: python .github/scripts/check_version.py

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  wait_for_tests:
    # Cross-workflow gate: run_tests.yml also triggers on v* tags, but GitHub
    # Actions has no direct dependency between workflows, so poll the API for
    # the test run on this commit and mirror its conclusion. Fails (blocking
    # upload_pypi) if the tests fail, never appear, or exceed the timeout.
    name: Wait for test suite
    if: github.repository_owner == 'michalsta' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Wait for run_tests.yml to succeed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          while true; do
            run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/run_tests.yml/runs?head_sha=${GITHUB_SHA}&per_page=1" \
                   --jq '.workflow_runs[0] // empty | "\(.status) \(.conclusion) \(.html_url)"')"
            if [ -z "$run" ]; then
              echo "No test workflow run found yet for ${GITHUB_SHA}; waiting..."
            else
              status="${run%% *}"
              rest="${run#* }"
              conclusion="${rest%% *}"
              url="${rest#* }"
              echo "Test run: status=${status} conclusion=${conclusion} ${url}"
              if [ "${status}" = "completed" ]; then
                if [ "${conclusion}" = "success" ]; then
                  exit 0
                fi
                echo "Test workflow concluded with '${conclusion}'; refusing to publish." >&2
                exit 1
              fi
            fi
            sleep 60
          done

  upload_pypi:
    needs: [build_wheels, build_sdist, wait_for_tests]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    # if: github.event_name == 'release' && github.event.action == 'published'
    # or, alternatively, upload to PyPI on every tag starting with 'v' (remove on: release above to use this)
    if: github.repository_owner == 'michalsta' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v5
        with:
          # unpacks all CIBW artifacts into dist/
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        # To test uploads to TestPyPI, uncomment the following:
        # with:
        #   repository-url: https://test.pypi.org/legacy/
